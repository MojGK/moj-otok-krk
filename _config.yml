title: Moj Otok Krk
description: Lokalni portal otoka Krka – vijesti, događanja, povijest i život na otoku
tagline: Lokalni portal otoka Krka
baseurl: "/moj-otok-krk"
url: "https://mojgk.github.io"
theme: null
markdown: kramdown
permalink: /:title/
timezone: Europe/Zagreb
lang: hr_HR

exclude:
  - README.md
  - README-KRK.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - .github

nav:
  - title: Početna
    url: /
  - title: Događaji
    url: /dogadaji/
  - title: Kalendar
    url: /kalendar/
  - title: Kategorije
    url: /kategorije/
  - title: Povijest
    url: /povijest/
  - title: Zaposlenje
    url: /zaposlenje/

author:
  name: Moj Otok Krk
  bio: Lokalni portal otoka Krka – vijesti, događanja i priče s cijelog otoka.

ankete:
  timeout_ms: 4000
  servis:
    naziv: countapi
    get: "https://countapi.mileshilliard.com/api/v1/get/mojotokkrk-{kljuc}"
    hit: "https://countapi.mileshilliard.com/api/v1/hit/mojotokkrk-{kljuc}"
  rezerva:
    naziv: abacus
    get: "https://abacus.jasoncameron.dev/get/mojgk.github.io/{kljuc}"
    hit: "https://abacus.jasoncameron.dev/hit/mojgk.github.io/{kljuc}"
    timeout_ms: 8000

oglasi_kontakt: ""

# Prazno = brojač isključen (javiti Andreju za kod)
goatcounter: ""

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
logo: /assets/images/baska-panorama-commons.jpg
feed:
  path: feed.xml
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/images/baska-panorama-commons.jpg
