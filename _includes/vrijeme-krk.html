{%- comment -%}
Widget vremena za Krk. Podaci: Open-Meteo (besplatno, bez ključa i kolačića), dohvaća ih preglednik.
Ako API ne odgovori, prikazuje se kratka poruka umjesto prognoze.
{%- endcomment -%}
<div class="sidebar-box weather" id="vrijeme-krk" aria-live="polite">
  <h3>Vrijeme · Krk</h3>
  <div class="wx-body" data-wx-body>
    <p class="wx-loading">Učitavam prognozu…</p>
  </div>
  <p class="wx-credit">Podaci: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
</div>
<script>
(function () {
  var box = document.getElementById('vrijeme-krk');
  if (!box || box.dataset.ready) return; box.dataset.ready = '1';
  var body = box.querySelector('[data-wx-body]');
  var URL_ = 'https://api.open-meteo.com/v1/forecast?latitude=45.026&longitude=14.575&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe/Zagreb&forecast_days=3';
  var W = {
    0: ['Vedro', '☀️'], 1: ['Pretežno vedro', '🌤️'], 2: ['Djelomično oblačno', '⛅'], 3: ['Oblačno', '☁️'],
    45: ['Magla', '🌫️'], 48: ['Magla s injem', '🌫️'],
    51: ['Slaba rosulja', '🌦️'], 53: ['Rosulja', '🌦️'], 55: ['Jaka rosulja', '🌧️'],
    56: ['Ledena rosulja', '🌧️'], 57: ['Jaka ledena rosulja', '🌧️'],
    61: ['Slaba kiša', '🌦️'], 63: ['Kiša', '🌧️'], 65: ['Jaka kiša', '🌧️'],
    66: ['Ledena kiša', '🌧️'], 67: ['Jaka ledena kiša', '🌧️'],
    71: ['Slab snijeg', '🌨️'], 73: ['Snijeg', '🌨️'], 75: ['Jak snijeg', '❄️'], 77: ['Zrnati snijeg', '🌨️'],
    80: ['Slabi pljuskovi', '🌦️'], 81: ['Pljuskovi', '🌧️'], 82: ['Jaki pljuskovi', '⛈️'],
    85: ['Snježni pljuskovi', '🌨️'], 86: ['Jaki snježni pljuskovi', '❄️'],
    95: ['Grmljavina', '⛈️'], 96: ['Grmljavina s tučom', '⛈️'], 99: ['Jaka grmljavina s tučom', '⛈️']
  };
  var DANI = ['ned', 'pon', 'uto', 'sri', 'čet', 'pet', 'sub'];
  function w(c) { return W[c] || ['Nepoznato', '🌡️']; }
  function t(x) { return Math.round(x) + '°'; }
  function fail() {
    body.innerHTML = '<p class="wx-error">Prognoza trenutačno nije dostupna. <a href="https://open-meteo.com/en/docs#latitude=45.026&longitude=14.575" target="_blank" rel="noopener">Open-Meteo</a></p>';
  }
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
  fetch(URL_, ctl ? { signal: ctl.signal } : {}).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (d) {
    clearTimeout(timer);
    var c = d.current, dl = d.daily;
    if (!c || !dl || !dl.time) throw new Error('format');
    var now = w(c.weather_code);
    var html = '<div class="wx-now">' +
      '<span class="wx-icon" aria-hidden="true">' + now[1] + '</span>' +
      '<span class="wx-temp">' + t(c.temperature_2m) + '<small>C</small></span>' +
      '<span class="wx-desc"><strong>' + now[0] + '</strong><span>💨 Vjetar ' + Math.round(c.wind_speed_10m) + ' km/h</span>' +
      '<span>Danas ' + t(dl.temperature_2m_min[0]) + ' / ' + t(dl.temperature_2m_max[0]) + '</span></span></div>';
    if (dl.time.length > 1) {
      html += '<ul class="wx-days">';
      for (var i = 1; i < Math.min(3, dl.time.length); i++) {
        var p = dl.time[i].split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]), dw = w(dl.weather_code[i]);
        html += '<li><span class="wx-day">' + DANI[dt.getDay()] + ' ' + (+p[2]) + '. ' + (+p[1]) + '.</span>' +
          '<span class="wx-dicon" title="' + dw[0] + '">' + dw[1] + '</span>' +
          '<span class="wx-range">' + t(dl.temperature_2m_min[i]) + ' / ' + t(dl.temperature_2m_max[i]) + '</span></li>';
      }
      html += '</ul>';
    }
    body.innerHTML = html;
    box.classList.add('loaded');
  }).catch(function () { clearTimeout(timer); fail(); });
})();
</script>
